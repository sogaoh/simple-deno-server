services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alb-sample-app
    environment:
      PORT: "8080"
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:8080/healthz'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
